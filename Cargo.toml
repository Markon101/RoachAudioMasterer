[package]
name = "roach-audio-masterer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Autonomous mastering, spatial dynamics, and acoustic scene restoration engine"
default-run = "roach-audio-masterer"

[[bin]]
name = "roach-audio-masterer"
path = "src/main.rs"

[[bin]]
name = "highband"
path = "src/bin/highband.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opencl3 = { version = "0.12.3", optional = true, default-features = false, features = ["dynamic", "CL_VERSION_1_2"] }

[features]
default = []
opencl = ["dep:opencl3"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
