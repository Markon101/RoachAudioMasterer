[package]
name = "roach-audio-masterer"
version = "1.0.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Autonomous mastering, spatial dynamics, and acoustic scene restoration engine"
default-run = "roach-audio-masterer"

[[bin]]
name = "roach-audio-masterer"
path = "src/main.rs"

[[bin]]
name = "highband"
path = "src/bin/highband.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opencl3 = { version = "0.12.3", optional = true, default-features = false, features = ["dynamic", "CL_VERSION_1_2"] }
# Pinned exactly: cudarc is pre-1.0 and its allocation/launch APIs move between
# minor versions. `dynamic-loading` is pure dlopen, so no CUDA toolkit is needed
# to build this tree (Termux and CI images included). `cuda-12080` selects the
# driver-API binding level, which is a different axis from which libnvrtc gets
# dlopened at runtime.
cudarc = { version = "=0.19.8", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12080"] }

[features]
default = []
opencl = ["dep:opencl3"]
cuda = ["dep:cudarc"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
